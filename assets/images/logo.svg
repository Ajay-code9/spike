<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none" class="spike-logo">
  <defs>
    <linearGradient id="spikeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="spikeAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#FFDF73" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Stylized Spike Mark -->
  <g transform="translate(2, 6)">
    <!-- Left Wing / Spike Blade -->
    <path d="M4 26 L14 4 L18 4 L8 26 Z" fill="url(#spikeAccent)" />
    <!-- Center Sharp Spike Blade -->
    <path d="M12 26 L22 0 L26 0 L16 26 Z" fill="url(#spikeGold)" filter="url(#goldGlow)" />
    <!-- Right Lower Blade -->
    <path d="M19 26 L26 11 L29 11 L22 26 Z" fill="url(#spikeAccent)" opacity="0.85" />
    <!-- Horizontal Cross Cut Accent -->
    <polygon points="9,18 24,18 22,21 7,21" fill="#FFFFFF" opacity="0.3" />
  </g>
  <!-- SPIKE Wordmark -->
  <text x="40" y="27" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="0.12em" fill="#FFFFFF">SPIKE</text>
</svg>
